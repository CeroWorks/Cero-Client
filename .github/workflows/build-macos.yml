name: CeroClient Build CI (macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-14] # macos-13 = Intel, macos-14 = ARM64
    runs-on: ${{ matrix.runner }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Homebrew dependencies
      run: |
        brew install python@3.12 curl pkg-config git
        brew link --force python@3.12

    - name: Set up JDK 17 (for Minecraft Agent)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run CeroClient Build Pipeline
      run: python3 build.py

    - name: Determine Architecture
      id: arch
      run: |
        if [[ "${{ matrix.runner }}" == "macos-13" ]]; then
          echo "ARCH=x86_64" >> $GITHUB_OUTPUT
        else
          echo "ARCH=arm64" >> $GITHUB_OUTPUT
        fi

    - name: Upload CeroClient Binaries
      uses: actions/upload-artifact@v4
      with:
        name: CeroClient-macos-${{ steps.arch.outputs.arch }}-binaries
        path: |
          bin/macos/client/CeroClient
          bin/macos/bootstrapper/ceroclient-bootstrapper
        
    - name: Upload Assets
      uses: actions/upload-artifact@v4
      with:
        name: CeroClient-macos-${{ steps.arch.outputs.arch }}-assets
        path: bin/assets/assets.dat